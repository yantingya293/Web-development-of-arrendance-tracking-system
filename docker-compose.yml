# 学习打卡网页 · 一键生产部署（Day 21 交付）
#
# 用法：
#   1. cp .env.example .env 并填写 SESSION_SECRET（强随机）与 ADMIN_PASSWORD
#   2. docker compose up -d --build
#   3. 浏览器访问 http://<主机>:3000；数据落在命名卷 app-data（含 SQLite 库与上传文件）
#
# SESSION_SECRET 使用 :? 强制校验——未设置时 compose 直接报错，防止带空密钥上线。
services:
  app:
    build:
      context: .
      # 国内网络默认走清华 apk 镜像源（官方 CDN 常超时）；海外部署改回
      # https://dl-cdn.alpinelinux.org 或在 .env 里设 ALPINE_MIRROR 覆盖
      args:
        ALPINE_MIRROR: ${ALPINE_MIRROR:-https://mirrors.tuna.tsinghua.edu.cn}
    ports:
      # 仅绑本机：对外由宿主机 nginx/Caddy 反代（TLS 终结），应用不直接暴露公网
      - "127.0.0.1:3000:3000"
    environment:
      NODE_ENV: production
      SESSION_SECRET: ${SESSION_SECRET:?请在 .env 中设置强随机的 SESSION_SECRET（至少 32 字符）}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # nginx 终结 TLS 时信任 X-Forwarded-* 头（app.js 对应 TRUST_PROXY 判定）
      TRUST_PROXY: "1"
    volumes:
      - app-data:/app/data
    restart: unless-stopped

volumes:
  app-data:
